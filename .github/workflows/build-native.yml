name: Build Native Apps

# ============================================================================
# Build MASOMO native installers for all platforms WITHOUT Tauri:
#   - Windows: .exe (NSIS installer) + portable .exe   — via Electron
#   - macOS:   .dmg (x64 + arm64)                      — via Electron
#   - Linux:   .deb + .AppImage                        — via Electron
#   - Android: .apk (debug + release)                  — via Capacitor
#   - iOS:     .ipa (unsigned)                         — via Capacitor
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for mobile/desktop apps (e.g., https://vercel.app)'
        required: true
        default: 'https://vercel.app'
      build_type:
        description: 'Build type (debug is faster, release is for distribution)'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  # ==========================================================================
  # DESKTOP BUILDS (Windows / macOS / Linux) — via Electron + electron-builder
  # ==========================================================================
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
            build_cmd: --win
          - os: macos-latest
            label: macos
            artifact: masomo-macos
            build_cmd: --mac
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
            build_cmd: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies (Electron runtime libs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3-dev libxss1-dev libxtst-dev \
            xauth xvfb libgbm-dev libasound2-dev libatk-bridge2.0-dev \
            libatk1.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrandr-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ github.event.inputs.server_url }}

      - name: Prepare Electron resources
        run: node scripts/prepare-electron-resources.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify app directory before packaging
        shell: bash
        run: |
          if [ ! -d "electron/app" ] || [ ! -f "electron/app/package.json" ]; then
            echo "ERROR: electron/app or package.json is missing! The prepare script failed."
            exit 1
          fi
          echo "=== Content of electron/app ==="
          ls -la electron/app/

      - name: Build Electron app
        # L'argument additionnel résout l'erreur assistedInstaller.nsh de NSIS sur Windows
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.build_cmd }} --config.nsis.assistedInstaller=false
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNSUPPORTED_ELECTRON_VERSION: true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.deb
            electron/dist/*.AppImage
          retention-days: 30

  # ==========================================================================
  # ANDROID & iOS BUILDS — via Capacitor
  # ==========================================================================
  mobile:
    name: Mobile Apps (Android & iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Update Capacitor config URL (Robust Regex)
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i "" "s|url:.*|url: '${SERVER_URL}'|g" capacitor.config.ts || sed -i "s|url:.*|url: '${SERVER_URL}'|g" capacitor.config.ts
          echo "=== capacitor.config.ts updated ==="
          cat capacitor.config.ts

      - name: Create static production web assets
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><script>window.location.href="${{ github.event.inputs.server_url }}";</script></head><body></body></html>' > out/index.html

      # --- SECTION ANDROID ---
      - name: Build Android APK
        run: |
          bun add @capacitor/android@^6
          bunx cap add android || true
          bunx cap sync android
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi
        shell: bash

      # --- SECTION iOS ---
      - name: Build iOS IPA (Unsigned)
        run: |
          bun add @capacitor/ios@^6
          bunx cap add ios || true
          bunx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          cd build && zip -r Masomo-unsigned.ipa Payload
        shell: bash

      - name: Upload Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-mobile
          path: |
            android/app/build/outputs/apk/**/*.apk
            ios/App/build/Masomo-unsigned.ipa
          retention-days: 30
